# SQL Server JDBC configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LeadwayPensureDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=StrongPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Disable Hibernate from changing column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 2. Crucial: Tell Hibernate to drop and recreate tables if they don't exist
spring.jpa.hibernate.ddl-auto=update

